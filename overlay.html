<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Điện Phật – Tương tác TikTok Live</title>
<style>
:root{--gold:#f3c969;--gold2:#a8741a;--lac:#7a1410;--wood:#2a140b;--ink:#fff4d6;--paper:#fff3d9}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#000;overflow:hidden;font-family:"Be Vietnam Pro","Segoe UI",system-ui,sans-serif}
#stage{position:relative;height:100vh;aspect-ratio:9/16;max-width:100vw;margin:auto;overflow:hidden;
 background:linear-gradient(#1a0c06 0,#3a1b0c 45%,#5a2a10 100%)}
#halo{position:absolute;left:50%;top:30%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);
 background:radial-gradient(circle,#fff0b0 0,#f7c853 18%,rgba(214,140,30,.55) 38%,transparent 66%);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{opacity:.78;transform:translate(-50%,-50%) scale(1.06)}}
#buddha{position:absolute;left:50%;top:12%;width:44%;transform:translateX(-50%);filter:drop-shadow(0 0 24px #ffd36a)}
#carpet{position:absolute;left:0;right:0;top:36%;bottom:0;background:linear-gradient(#6d0f0c,#a3161a);
 clip-path:polygon(40% 0,60% 0,100% 100%,0 100%);box-shadow:inset 0 0 0 4px var(--gold2)}
#carpet::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 38px,rgba(243,201,105,.18) 38px 40px)}
#people{position:absolute;inset:0}
.p{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:left .5s,top .5s}
.p svg{display:block}
.p .n{max-width:34vw;color:var(--ink);font-size:11px;font-weight:600;text-shadow:0 1px 3px #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.b{background:var(--paper);color:#3b1d0a;border:2px solid var(--gold2);border-radius:12px;padding:3px 9px;font-size:12px;font-weight:600;
 max-width:40vw;margin-bottom:3px;text-align:center;animation:pop .25s ease-out;word-break:break-word}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.p.bow svg{animation:bow .9s ease-in-out}
@keyframes bow{40%{transform:translateY(5px) scaleY(.92)}}
#board{position:absolute;left:3%;top:8%;width:46%;background:rgba(30,14,8,.82);border:2px solid var(--gold2);border-radius:10px;padding:8px}
#board h2{font-size:13px;color:var(--gold);margin-bottom:2px}
#board small{display:block;font-size:9px;color:#d9b66a;margin-bottom:6px}
#board li{list-style:none;display:flex;justify-content:space-between;gap:6px;font-size:12px;color:var(--ink);
 padding:4px 7px;margin-top:3px;border:1px solid rgba(243,201,105,.5);border-radius:7px}
#board li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#board li b{color:var(--gold);white-space:nowrap}
#board li{position:relative}
#board li.r1{color:#3a2300;font-weight:700;background:linear-gradient(100deg,#fff0a8,#f3c969 45%,#d9a024);border:2px solid #ffe38a;box-shadow:0 0 12px rgba(255,214,90,.75)}
#board li.r1 b{color:#6b3c00}
#board li.r1::before{content:"";position:absolute;right:-7px;top:-12px;width:24px;height:18px;
 background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 18'><g fill='%23ffd9e6' stroke='%23c2185b' stroke-width='.8'><path d='M12 17C8 14 8 7 12 2c4 5 4 12 0 15z'/><path d='M11 17C6 16 2 11 2 6c5 0 9 4 9 11z'/><path d='M13 17c5-1 9-6 9-11-5 0-9 4-9 11z'/></g></svg>") center/contain no-repeat}
#board li.r2{color:#1f2630;font-weight:700;background:linear-gradient(100deg,#f4f7fb,#c9d1da 50%,#98a3b0);border:2px solid #e8edf3}
#board li.r2 b{color:#2f3a48}
#board li.r3{color:#2b1405;font-weight:700;background:linear-gradient(100deg,#f0b27a,#cd7f32 50%,#8f5320);border:2px solid #e2a066}
#board li.r3 b{color:#3d1d08}
#board .empty{opacity:.6;border-style:dashed}
#monk{position:absolute;left:5%;top:37%;width:15%;display:flex;flex-direction:column;align-items:center}
#bless{position:absolute;left:0;bottom:100%;margin-bottom:7px;width:225%;background:var(--paper);color:#3b1d0a;border:2px solid var(--gold2);border-radius:10px;padding:6px 8px;font-size:11px;font-weight:600;line-height:1.35;text-align:center;opacity:0;transition:opacity .6s}
#bless::after{content:'';position:absolute;left:22px;top:100%;border:7px solid transparent;border-top-color:var(--gold2)}
#bless.on{opacity:1}
#monk svg{width:100%;animation:tap 1.1s steps(2) infinite}
@keyframes tap{50%{transform:translateY(2px)}}
#monk em{font-style:normal;font-size:10px;color:var(--ink);background:#7a4a14;border-radius:8px;padding:1px 8px;margin-top:2px}
#status{position:absolute;right:6px;bottom:6px;font-size:10px;color:#fff9;z-index:5}
/* bảng vàng: avatar + tên + điểm */
#board{width:52%}
#board ol{padding:0;margin:0}
#board li{padding:4px 6px;align-items:center;justify-content:flex-start}
#board li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;flex:none;object-fit:cover;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:11px;font-weight:800;color:#fff;border:1px solid rgba(255,255,255,.55)}
#board li.r1 .av,#board li.r2 .av,#board li.r3 .av{color:#3a2300}
/* thanh tim trên đầu nhân vật */
.hb{width:46px;height:8px;border:1.5px solid #fff;border-radius:6px;background:rgba(0,0,0,.55);overflow:hidden;margin:0 auto 3px;position:relative}
.hb i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9cc2,#ff3d86);transition:width .3s}
.hb::after{content:"♥";position:absolute;left:50%;top:50%;transform:translate(-50%,-54%);font-size:7px;color:#fff;line-height:1}
.hb.full{box-shadow:0 0 9px #ff4f9a;animation:hpulse .7s ease-in-out infinite}
@keyframes hpulse{50%{transform:scale(1.15)}}
.sc{transition:transform 1s}
.p.walk{transition:left 1.1s ease-in-out,top 1.1s ease-in-out}
/* lư hương giữa điện */
#burner{position:absolute;left:50%;top:51%;width:17%;transform:translate(-50%,-100%);z-index:50;filter:drop-shadow(0 4px 6px #000a)}
#burner .tip{fill:#5a2a10;transition:fill .4s}
#burner.lit .tip{fill:#ff5a1f;filter:drop-shadow(0 0 4px #ff8a3c)}
#burner .sm{opacity:0;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round}
#burner.lit .sm{animation:smoke 2.4s ease-out infinite}
#burner.lit .sm:nth-of-type(2){animation-delay:.8s}#burner.lit .sm:nth-of-type(3){animation-delay:1.6s}
@keyframes smoke{0%{opacity:.7;transform:translateY(0)}100%{opacity:0;transform:translateY(-34px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<div id="stage">
 <div id="halo"></div>
 <svg id="buddha" viewBox="0 0 200 260" aria-label="Tượng Phật A Di Đà">
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#b8801f"/></linearGradient></defs>
  <circle cx="100" cy="58" r="30" fill="url(#g)"/><circle cx="100" cy="22" r="8" fill="url(#g)"/>
  <path d="M60 100q40-22 80 0l34 92q-74 24-148 0z" fill="url(#g)"/>
  <path d="M10 196q90 34 180 0l6 26q-96 40-192 0z" fill="#d79b2d"/>
  <ellipse cx="100" cy="150" rx="26" ry="12" fill="#c98f24"/>
 </svg>
 <div id="carpet"></div>
 <svg id="burner" viewBox="0 0 100 100" aria-label="Lư hương">
  <g stroke="#c9a04a" stroke-width="2.4"><line x1="38" y1="14" x2="38" y2="52"/><line x1="50" y1="8" x2="50" y2="52"/><line x1="62" y1="14" x2="62" y2="52"/></g>
  <circle class="tip" cx="38" cy="14" r="3"/><circle class="tip" cx="50" cy="8" r="3"/><circle class="tip" cx="62" cy="14" r="3"/>
  <path class="sm" d="M38 10q-6-8 0-16"/><path class="sm" d="M50 4q6-8 0-16"/><path class="sm" d="M62 10q-6-8 0-16"/>
  <ellipse cx="50" cy="56" rx="30" ry="7" fill="#6e5a2c"/>
  <path d="M18 56q0 28 32 28t32-28z" fill="url(#g)" stroke="#8a5d12" stroke-width="2"/>
  <path d="M18 58q-12 0-10 10M82 58q12 0 10 10" fill="none" stroke="#d79b2d" stroke-width="5" stroke-linecap="round"/>
  <path d="M30 80l-6 14M70 80l6 14M50 84v12" stroke="#b8801f" stroke-width="6" stroke-linecap="round"/>
 </svg>
 <div id="people"></div>
 <aside id="board"><h2>BẢNG VÀNG TÂM ĐỨC</h2><small>Top 5 tâm đức</small><ol id="rank"></ol></aside>
 <div id="monk">
  <svg viewBox="0 0 80 90"><circle cx="40" cy="20" r="13" fill="#e9b98a"/><path d="M12 84q2-48 28-48t28 48z" fill="#e0a021"/><circle cx="62" cy="68" r="9" fill="#8a4b14"/></svg>
  <em>Chú tiểu</em>
  <div id="bless"></div>
 </div>
 <div id="status"></div>
</div>
<script>
/* ===== Cấu hình ===== */
const CFG={
 WS:'wss://tiktok-live-overlay-tamduc.onrender.com',
 GOLD_TO_TAMDUC:50,        // 1 vàng = 50 điểm Tâm Đức
 LIKES_TO_FILL:10,         // số lượt tim để đầy thanh tim
 RITUAL_MS:5000,           // thời gian đứng thắp hương
 BLESS_MS:60*1000,         // 1 phút/lượt, mỗi lượt đọc 1 câu
 MAX_FIGURES:30,           // tối đa 30 người đang hiển thị, vào trước ra trước
 BUBBLE_MS:6000
};
const BLESSINGS=["Nam Mô A Di Đà Phật!","Nguyện đem công đức này hướng về khắp tất cả.","Nam Mô Đại Từ Đại Bi Quán Thế Âm Bồ Tát!",
"Mỗi một niệm lành là một đóa hoa sen nở rộ trong tâm.","Sóng gió cuộc đời chỉ là thử thách, chúc thí chủ luôn vững lòng tin.",
"Nguyện cầu chư Phật mười phương gia hộ cho gia đình thí chủ sức khỏe dồi dào.","Vạn sự tùy duyên, cát tường như ý.",
"Nam Mô Đại Hưng Đại Nguyện Địa Tạng Vương Bồ Tát!","Bình yên đến từ bên trong tâm hồn.","Nguyện chúc chúng sinh kết nối được tâm thiện lương."];

/* ===== Trạng thái ===== */
const $=id=>document.getElementById(id);
const scores=new Map(); // uid -> {name,avatar,td}: điểm Tâm Đức cả phiên live, KHÔNG xóa khi rời live
const figs=new Map();   // uid -> {el,sc,bar,slot,t,rit}: chỉ người bình luận; Map giữ thứ tự vào => FIFO
const hearts=new Map(); // uid -> lượt tim đang tích (tối đa LIKES_TO_FILL)
const used=new Set();
const COLORS=['#7aa0c8','#c88a7a','#8ab38a','#c8b27a','#a98ac8','#7ac8c0','#c87a9e'];
// Lưới chỗ quỳ (30 chỗ): hàng sau nhỏ/xa, hàng trước lớn/gần. Chừa khoảng trống phía trên cho lư hương.
const SLOTS=[];for(let r=0;r<6;r++){const n=3+Math.min(r,3);for(let c=0;c<n;c++){
 const k=r/5;SLOTS.push({x:50+((c+.5)/n-.5)*(26+k*62),y:63+k*32,s:.55+k*.6});}}
const MAX=Math.min(CFG.MAX_FIGURES,SLOTS.length);
const FILL=CFG.LIKES_TO_FILL;

function figure(color){return `<svg width="46" height="52" viewBox="0 0 46 52"><circle cx="23" cy="9" r="7" fill="#e6b88c"/>
<path d="M6 50q0-32 17-32t17 32z" fill="${color}"/><rect x="14" y="30" width="18" height="6" rx="3" fill="#e6b88c" opacity=".9"/></svg>`;}

function removeFig(uid){const f=figs.get(uid);if(!f)return;clearTimeout(f.t);f.el.remove();used.delete(f.slot);figs.delete(uid);}
function updateBar(f,uid){const h=hearts.get(uid)||0;f.bar.firstChild.style.width=Math.min(100,h/FILL*100)+'%';f.bar.classList.toggle('full',h>=FILL);}
function spawn(uid,name){
 let f=figs.get(uid);if(f){f.el.querySelector('.n').textContent=name;return f;}
 while(figs.size>=MAX)removeFig(figs.keys().next().value); // người vào sớm nhất ra trước
 let slot=0;while(used.has(slot))slot++;used.add(slot);
 const s=SLOTS[slot],el=document.createElement('div');
 el.className='p';el.style.cssText=`left:${s.x}%;top:${s.y}%;z-index:${Math.round(s.y)}`;
 el.innerHTML=`<div class="bx"></div><div class="sc" style="transform:scale(${s.s});transform-origin:bottom"><div class="hb"><i></i></div>${figure(COLORS[uid.length%COLORS.length])}</div><div class="n"></div>`;
 el.querySelector('.n').textContent=name;$('people').appendChild(el);
 f={el,sc:el.querySelector('.sc'),bar:el.querySelector('.hb'),slot,t:0,rit:false};figs.set(uid,f);
 updateBar(f,uid);
 if((hearts.get(uid)||0)>=FILL)setTimeout(()=>ritual(uid),700); // đã đủ tim từ trước khi có hình
 return f;
}
function say(f,text){
 const bx=f.el.querySelector('.bx'),b=document.createElement('div');b.className='b';b.textContent=text.slice(0,60);
 bx.replaceChildren(b);f.el.classList.remove('bow');void f.el.offsetWidth;f.el.classList.add('bow');
 clearTimeout(f.t);f.t=setTimeout(()=>bx.replaceChildren(),CFG.BUBBLE_MS);
}

/* ===== Thả tim -> đầy thanh -> đi thắp hương ===== */
let litCount=0,spotN=0;const SPOTS=[44,50,56];
function ritual(uid){
 const f=figs.get(uid);if(!f||f.rit)return;f.rit=true;
 const s=SLOTS[f.slot],x=SPOTS[spotN++%3];
 f.el.classList.add('walk');f.el.style.zIndex=80;
 f.el.style.left=x+'%';f.el.style.top='57%';f.sc.style.transform='scale(1)';   // đi tới trước lư hương
 setTimeout(()=>{                                                              // đã tới nơi: thắp hương
  if(figs.get(uid)!==f)return;
  litCount++;$('burner').classList.add('lit');say(f,'Thắp nén hương');
  setTimeout(()=>{
   litCount=Math.max(0,litCount-1);if(!litCount)$('burner').classList.remove('lit');
   if(figs.get(uid)!==f)return;
   hearts.set(uid,0);updateBar(f,uid);                                         // reset thanh tim
   f.el.style.left=s.x+'%';f.el.style.top=s.y+'%';f.sc.style.transform=`scale(${s.s})`;
   setTimeout(()=>{if(figs.get(uid)===f){f.el.classList.remove('walk');f.el.style.zIndex=Math.round(s.y);f.rit=false;
     if((hearts.get(uid)||0)>=FILL)ritual(uid);}},1150);
  },CFG.RITUAL_MS);
 },1200);
}
function addHearts(uid,n){
 const h=Math.min(FILL,(hearts.get(uid)||0)+n);hearts.set(uid,h);
 const f=figs.get(uid);if(!f)return;        // chưa bình luận: tim được giữ lại tới khi có hình
 updateBar(f,uid);if(h>=FILL&&!f.rit)ritual(uid);
}

/* ===== Bảng vàng ===== */
function addScore(uid,name,n,avatar){
 let s=scores.get(uid);if(!s){s={name,avatar:'',td:0};scores.set(uid,s);}
 s.name=name||s.name;if(avatar)s.avatar=avatar;s.td+=n;renderRank();
}
function avEl(u){
 const initial=((u&&u.name)||'?').trim().charAt(0).toUpperCase();
 if(u&&u.avatar){const i=document.createElement('img');i.className='av';i.src=u.avatar;i.referrerPolicy='no-referrer';
  i.onerror=()=>{const d=document.createElement('div');d.className='av';d.textContent=initial;i.replaceWith(d);};return i;}
 const d=document.createElement('div');d.className='av';d.textContent=u?initial:'';return d;
}
function renderRank(){
 const top=[...scores.values()].filter(u=>u.td>0).sort((a,b)=>b.td-a.td).slice(0,5),ol=$('rank');ol.replaceChildren();
 for(let i=0;i<5;i++){const u=top[i],li=document.createElement('li');if(u&&i<3)li.className='r'+(i+1);
  if(!u){li.className='empty';li.append(avEl(null));const a=document.createElement('span');a.className='nm';a.textContent='—';li.append(a);}
  else{const a=document.createElement('span'),b=document.createElement('b');a.className='nm';a.textContent=u.name;b.textContent='★ '+u.td;li.append(avEl(u),a,b);}
  ol.appendChild(li);}
}

/* ===== Xử lý sự kiện (chat / gift / like) ===== */
function handle(e){
 if(e.type==='chat'){                      // 1 bình luận = 1 Tâm Đức, hiện hình nhân + nội dung bình luận
  addScore(e.uid,e.name,1,e.avatar);
  say(spawn(e.uid,e.name),e.text||'🙏');
 }else if(e.type==='gift'){                // 1 vàng = GOLD_TO_TAMDUC điểm, không sinh hình nhân
  const g=Math.max(0,+e.gold||0)*CFG.GOLD_TO_TAMDUC;addScore(e.uid,e.name,g,e.avatar);
  const f=figs.get(e.uid);if(f)say(f,'+'+g+' tâm đức');
 }else if(e.type==='like'){                // thả tim: tích vào thanh tim
  addHearts(e.uid,Math.max(1,+e.count||1));
 }
}

/* ===== Chú tiểu chúc phúc ===== */
let order=[],lastB=-1;
function bless(){
 if(!order.length){order=BLESSINGS.map((_,i)=>i).sort(()=>Math.random()-.5);if(order[0]===lastB)order.push(order.shift());}
 lastB=order.shift();const el=$('bless');el.textContent='“'+BLESSINGS[lastB]+'”';el.classList.add('on');
 setTimeout(()=>el.classList.remove('on'),12000);
}
setTimeout(bless,4000);setInterval(bless,CFG.BLESS_MS);

/* ===== Kết nối WebSocket (hoặc chế độ demo) ===== */
const demo=new URLSearchParams(location.search).has('demo');
function connect(){
 const ws=new WebSocket(CFG.WS);
 ws.onopen=()=>$('status').textContent='● live';
 ws.onmessage=m=>{try{const e=JSON.parse(m.data);window.evN=(window.evN||0)+1;$('status').textContent='● live · '+window.evN+' sự kiện · '+e.type;handle(e);}catch(_){}};
 ws.onclose=()=>{$('status').textContent='mất kết nối, thử lại…';setTimeout(connect,3000);};
}
if(demo){
 $('status').textContent='chế độ demo';
 const names=['Đắc Thịnh','May','Thích danh p…','xuka','Người đẹp C…','Bim ben tau','ANH TUYET','Trung Hiếu','Mai Anh','Cha Mu Hee'];
 const lines=['A Di Đà Phật','Cầu bình an','Nam mô','Cầu sức khỏe','amenn'];
 setInterval(()=>{const i=Math.random()*names.length|0,r=Math.random(),w={uid:'u'+i,name:names[i]};
  if(r<.2)handle({type:'gift',...w,gold:[1,5,10][Math.random()*3|0]});
  else if(r<.6)handle({type:'chat',...w,text:lines[Math.random()*lines.length|0]});
  else handle({type:'like',...w,count:1+(Math.random()*4|0)});},500);
}else connect();
renderRank();
</script></body></html>
